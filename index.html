<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Pazham Perukki Mobile First</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  html,body{margin:0;width:100%;height:100%;overflow:hidden}
  body{font-family:Arial,sans-serif;background:#87d8f2}
  :root{
    --sky:#87d8f2;
    --grass:#7ac84d;
    --grass-dark:#3c873b;
    --hud-bg:#fff0a8;
    --hud-border:#8a741d;
    --hud-text:#513f0d;
    --panel:#2f7c3d;
    --panel-border:#ffe56a;
    --btn:#ffc83b;
    --btn-shadow:#9a5f11;
    --ground-h:70px;
    --monkey-w:105px;
    --monkey-h:118px;
    --monkey-left:50%;
    --monkey-ground:64px;
    --obstacle-w:42px;
    --obstacle-h:105px;
    --banana-w:54px;
    --banana-h:48px;
    --title-size:30px;
    --hud-size:22px;
  }
  #game{position:fixed;inset:0;overflow:hidden;background:linear-gradient(var(--sky) 0 69%, #a8de76 69% 100%)}
  .cloud{position:absolute;background:#ffffffc9;width:64px;height:18px;border-radius:99px}.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:#ffffffc9}.cloud:before{width:24px;height:24px;left:10px;bottom:0}.cloud:after{width:34px;height:34px;left:26px;bottom:0}
  #title{position:absolute;top:calc(env(safe-area-inset-top) + 70px);left:50%;transform:translateX(-50%);z-index:10;text-align:center;font-size:var(--title-size);font-weight:800;color:#fff06a;text-shadow:2px 2px #2a6632;letter-spacing:.4px}
  #scoreboard{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:50%;transform:translateX(-50%);z-index:10;padding:5px 8px;border:2px solid var(--hud-border);border-radius:8px;background:var(--hud-bg);font:800 var(--hud-size) monospace;color:var(--hud-text)}
  #ground{position:absolute;left:0;right:0;bottom:0;height:var(--ground-h);background:#62b34a;border-top:5px solid var(--grass-dark);background-image:repeating-linear-gradient(90deg,transparent 0 20px,#448c3f 21px 26px,transparent 27px 46px);background-position:0 14px}
  #monkey{position:absolute;left:var(--monkey-left);bottom:var(--monkey-ground);width:var(--monkey-w);height:var(--monkey-h);z-index:6;will-change:transform,bottom}
  #monkey.running{animation:bob .14s infinite alternate}
  #monkey.running .leg1{animation:legA .15s infinite alternate}
  #monkey.running .leg2{animation:legB .15s infinite alternate}
  #monkey.running .arm1{animation:legB .15s infinite alternate}
  #monkey.running .arm2{animation:legA .15s infinite alternate}
  .leg1,.leg2{transform-origin:48px 75px}.arm1,.arm2{transform-origin:65px 52px}
  @keyframes legA{to{transform:rotate(25deg)}}
  @keyframes legB{to{transform:rotate(-25deg)}}
  @keyframes bob{to{transform:translateY(-2px)}}
  .obstacle{position:absolute;z-index:5;width:var(--obstacle-w);height:var(--obstacle-h);border:3px solid #4d2a16;border-radius:7px 7px 12px 12px;background:repeating-linear-gradient(0deg,#aa6730 0 10px,#76401a 11px 17px)}
  .obstacle:before{content:"";position:absolute;left:-4px;top:-7px;width:calc(var(--obstacle-w) + 2px);height:12px;border:2px solid #4d2a16;border-radius:50%;background:#cf853f}
  .banana{position:absolute;z-index:5;width:var(--banana-w);height:var(--banana-h);filter:drop-shadow(1px 2px 1px #2345)}
  .banana svg{width:100%;height:100%}
  #message{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:#163f2ab5;color:#fff;text-align:center}
  .panel{width:min(100%,320px);padding:18px 16px;border:3px solid var(--panel-border);border-radius:18px;background:var(--panel);box-shadow:0 8px #1f512c}
  .panel h1{margin:0 0 8px;font-size:28px;color:#ffea67;text-shadow:0 3px #88560f}
  .panel p{margin:0 0 12px;line-height:1.4;font-size:14px}
  .button{min-width:132px;min-height:44px;padding:11px 16px;border:2px solid #fff0a2;border-radius:10px;background:var(--btn);box-shadow:0 4px var(--btn-shadow);font:800 15px Arial,sans-serif;color:#55320a;cursor:pointer}
  .button:active{transform:translateY(3px);box-shadow:0 1px var(--btn-shadow)}
  .hidden{display:none!important}

  @media (min-width:390px){
    :root{--monkey-w:74px;--monkey-h:82px;--monkey-left:28px;--obstacle-w:30px;--obstacle-h:76px;--banana-w:37px;--banana-h:33px;--title-size:17px;--hud-size:12px}
  }
  @media (min-width:480px){
    :root{--ground-h:74px;--monkey-w:78px;--monkey-h:86px;--monkey-left:36px;--monkey-ground:68px;--obstacle-w:32px;--obstacle-h:82px;--banana-w:40px;--banana-h:35px;--title-size:18px;--hud-size:13px}
  }
  @media (min-width:768px){
    :root{--ground-h:82px;--monkey-w:92px;--monkey-h:100px;--monkey-left:72px;--monkey-ground:76px;--obstacle-w:40px;--obstacle-h:94px;--banana-w:48px;--banana-h:42px;--title-size:26px;--hud-size:17px}
    .cloud{width:100px;height:24px}.cloud:before{width:38px;height:38px;left:14px}.cloud:after{width:50px;height:50px;left:40px}
    #title{left:18px;top:18px}#scoreboard{right:18px;top:18px;padding:7px 10px}
    .panel{max-width:390px;padding:24px}.panel h1{font-size:34px}.panel p{font-size:15px}
  }
</style>
</head>
<body>
<div id="game">
  <div class="cloud" style="left:8%;top:12%"></div>
  <div class="cloud" style="left:58%;top:18%;transform:scale(.72)"></div>
  <div id="title">PAZHAM PERUKKI</div>
  <div id="scoreboard">BANANAS: <span id="score">0</span> &nbsp; HI: <span id="high">0</span></div>

  <div id="monkey" class="running">
    <svg viewBox="0 0 105 105" aria-label="Monkey">
      <path d="M34 74C18 76 18 88 28 88c8 0 9-8 3-10" fill="none" stroke="#71391d" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="55" cy="63" rx="20" ry="20" fill="#8d4a25"/>
      <g class="arm1"><path d="M72 57l21 12" stroke="#71391d" stroke-width="10" stroke-linecap="round"/></g>
      <g class="arm2"><path d="M39 60L25 70" stroke="#71391d" stroke-width="9" stroke-linecap="round"/></g>
      <g class="leg1"><path d="M48 83L40 101" stroke="#71391d" stroke-width="11" stroke-linecap="round"/></g>
      <g class="leg2"><path d="M67 83l13 17" stroke="#71391d" stroke-width="11" stroke-linecap="round"/></g>
      <circle cx="55" cy="35" r="28" fill="#8d4a25"/>
      <circle cx="32" cy="31" r="13" fill="#71391d"/>
      <circle cx="78" cy="31" r="13" fill="#71391d"/>
      <ellipse cx="55" cy="43" rx="20" ry="16" fill="#f0b878"/>
      <circle cx="46" cy="36" r="3.5"/>
      <circle cx="65" cy="36" r="3.5"/>
      <ellipse cx="55" cy="46" rx="5" ry="3.5" fill="#4b291a"/>
      <path d="M49 52q6 6 13 0" fill="none" stroke="#4b291a" stroke-width="2.5"/>
    </svg>
  </div>

  <div id="ground"></div>

  <div id="message">
    <div class="panel">
      <h1>Pazham Perukki</h1>
      <p>Mobile-first full screen version. Tap anywhere to jump, avoid vertical logs, and collect bananas.</p>
      <p><b>Tap / Space / Up Arrow</b> to jump</p>
      <button class="button" id="start">START</button>
    </div>
  </div>
</div>
<script>
const game=document.getElementById('game');
const monkey=document.getElementById('monkey');
const message=document.getElementById('message');
const scoreText=document.getElementById('score');
const highText=document.getElementById('high');

let running=false,jumping=false,monkeyY=0,velocity=0,score=0,speed=255,lastTime=0,nextSpawn=0,objects=[],high=0;
let GROUND=64,MONKEY_LEFT=24,MONKEY_W=68,MONKEY_H=76,OBSTACLE_W=28,OBSTACLE_H=70,BANANA_W=34,BANANA_H=30;

function readVars(){
  const cs=getComputedStyle(document.documentElement);
  GROUND=parseFloat(cs.getPropertyValue('--monkey-ground'));
  MONKEY_LEFT=parseFloat(cs.getPropertyValue('--monkey-left'));
  MONKEY_W=parseFloat(cs.getPropertyValue('--monkey-w'));
  MONKEY_H=parseFloat(cs.getPropertyValue('--monkey-h'));
  OBSTACLE_W=parseFloat(cs.getPropertyValue('--obstacle-w'));
  OBSTACLE_H=parseFloat(cs.getPropertyValue('--obstacle-h'));
  BANANA_W=parseFloat(cs.getPropertyValue('--banana-w'));
  BANANA_H=parseFloat(cs.getPropertyValue('--banana-h'));
  monkey.style.left=`calc(50% - ${MONKEY_W/2}px)`;
  monkey.style.bottom=(GROUND+monkeyY)+'px';
}

function bananaSVG(){
  return '<svg viewBox="0 0 100 70"><path d="M12 10c10-4 17 1 21 9 10 22 29 30 55 21 6-2 10 4 5 9-18 19-52 17-68-8-6-9-11-20-13-31z" fill="#ffe244" stroke="#80500d" stroke-width="4"/><path d="M12 10L4 5l7-5 10 10M87 39l9 1 1 8-10-3" fill="#6c4017"/><path d="M25 23c13 21 37 26 55 18" fill="none" stroke="#fff8aa" stroke-width="4" stroke-linecap="round"/></svg>';
}

function spawn(){
  const isBanana=Math.random()<0.5;
  const el=document.createElement('div');
  el.className=isBanana?'banana':'obstacle';
  if(isBanana) el.innerHTML=bananaSVG();
  game.appendChild(el);

  const minBananaY = Math.max(82, MONKEY_H + 18);
  const maxBananaY = Math.min(game.clientHeight - GROUND - BANANA_H - 52, minBananaY + 82);

  objects.push({
    el,
    isBanana,
    x:game.clientWidth + 20,
    w:isBanana?BANANA_W:OBSTACLE_W,
    h:isBanana?BANANA_H:OBSTACLE_H,
    y:isBanana?(minBananaY + Math.random()*Math.max(12,maxBananaY-minBananaY)):0
  });
}

function jump(){
  if(!running||jumping) return;
  jumping=true;
  velocity=game.clientWidth<768?640:760;
}

function collide(a,b){
  return a.left < b.right && a.right > b.left && a.bottom < b.top && a.top > b.bottom;
}

function gameOver(){
  running=false;
  monkey.classList.remove('running');
  if(score>high){high=score;highText.textContent=high;}
  message.innerHTML=`<div class="panel"><h1>Game Over</h1><p>You collected <b>${score}</b> banana${score===1?'':'s'}.</p><button class="button" id="restart">PLAY AGAIN</button></div>`;
  message.classList.remove('hidden');
  document.getElementById('restart').onclick=startGame;
}

function update(time){
  if(!running) return;
  const dt=Math.min((time-lastTime)/1000,.028);
  lastTime=time;

  velocity -= (game.clientWidth<768?1700:1850)*dt;
  monkeyY += velocity*dt;
  if(monkeyY<=0){monkeyY=0;velocity=0;jumping=false;}
  monkey.style.bottom=(GROUND+monkeyY)+'px';

  if(time>=nextSpawn){
    spawn();
    nextSpawn=time+(game.clientWidth<768?1150:1000)+Math.random()*260;
  }

  const mRect={
    const monkeyLeft=(game.clientWidth-MONKEY_W)/2;
    left:monkeyLeft+8,
    right:monkeyLeft+MONKEY_W-6,
    bottom:GROUND+monkeyY+6,
    top:GROUND+monkeyY+MONKEY_H-6
  };

  for(let i=objects.length-1;i>=0;i--){
    const o=objects[i];
    o.x -= speed*dt;
    o.el.style.left=o.x+'px';
    o.el.style.bottom=(GROUND+o.y)+'px';

    const r={left:o.x,right:o.x+o.w,bottom:GROUND+o.y,top:GROUND+o.y+o.h};

    if(collide(mRect,r)){
      if(o.isBanana){
        score++;
        scoreText.textContent=score;
        speed=Math.min(game.clientWidth<768?380:520,speed+4);
        o.el.remove();
        objects.splice(i,1);
        continue;
      }else{
        gameOver();
        return;
      }
    }

    if(o.x+o.w<0){
      o.el.remove();
      objects.splice(i,1);
    }
  }

  requestAnimationFrame(update);
}

function clearObjects(){
  objects.forEach(o=>o.el.remove());
  objects=[];
}

function startGame(){
  readVars();
  clearObjects();
  score=0;
  speed=game.clientWidth<768?255:330;
  monkeyY=0;
  velocity=0;
  jumping=false;
  scoreText.textContent='0';
  message.classList.add('hidden');
  running=true;
  monkey.classList.add('running');
  monkey.style.bottom=GROUND+'px';
  lastTime=performance.now();
  nextSpawn=lastTime+900;
  requestAnimationFrame(update);
}

document.getElementById('start').onclick=startGame;
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump();}});
game.addEventListener('pointerdown',e=>{if(!e.target.closest('button')) jump();});
addEventListener('resize',()=>{readVars();});
readVars();
highText.textContent=high;
</script>
</body>
</html>
